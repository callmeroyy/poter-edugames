<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk Dashboard Pemantau - POTER EDUGAMES</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="icon" type="image/png" href="/assets/poter-logo.png">
  <style>
    body {
      background-color: #F8FAFC;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .login-card {
      background-color: #FFFFFF;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 40px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
    }
    .login-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .login-brand-icon {
      width: 54px;
      height: 54px;
      border-radius: 14px;
      background-color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 14px auto;
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.12);
      overflow: hidden;
    }
    .login-brand-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 4px;
    }
    .login-title {
      font-size: 1.45rem;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.4px;
    }
    .login-desc {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-top: 4px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 6px;
    }
    .form-input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
      color: var(--text-main);
      background-color: #FFFFFF;
      outline: none;
      transition: border-color 0.15s ease;
    }
    .form-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.15);
    }
    .btn-submit-login {
      width: 100%;
      background-color: var(--primary);
      color: #FFFFFF;
      font-size: 1rem;
      font-weight: 700;
      padding: 14px;
      border-radius: var(--radius-sm);
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.15s ease;
      margin-top: 8px;
    }
    .btn-submit-login:hover {
      background-color: var(--primary-hover);
    }
    .login-alert {
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 18px;
      display: none;
    }
    .alert-danger {
      background-color: #FEE2E2;
      color: #991B1B;
      border: 1px solid #FCA5A5;
    }
    .login-footer-info {
      margin-top: 24px;
      border-top: 1px solid var(--border-color);
      padding-top: 16px;
      font-size: 0.8rem;
      color: var(--text-subtle);
      text-align: center;
    }
    .demo-credentials {
      background-color: #F1F5F9;
      border: 1px dashed #CBD5E1;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.8rem;
      margin-top: 16px;
      text-align: center;
      color: #334155;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="login-header">
      <div class="login-brand-icon"><img src="/assets/poter-logo.png" width="54" height="54" alt="Logo POTER Edugames"></div>
      <h1 class="login-title">Dashboard Pemantau</h1>
      <p class="login-desc">Masuk untuk memantau trafik web, unduhan APK, dan telemetri perangkat.</p>
    </div>

    <div class="login-alert alert-danger" id="loginError" role="alert"></div>

    <form id="loginForm" autocomplete="on">
      <div class="form-group">
        <label for="usernameInput" class="form-label">Nama Pengguna (Username)</label>
        <input 
          type="text" 
          id="usernameInput" 
          name="username" 
          class="form-input" 
          placeholder="admin" 
          required 
          autofocus 
        />
      </div>

      <div class="form-group">
        <label for="passwordInput" class="form-label">Kata Sandi (Password)</label>
        <input 
          type="password" 
          id="passwordInput" 
          name="password" 
          class="form-input" 
          placeholder="••••••••" 
          required 
        />
      </div>

      <button type="submit" class="btn-submit-login" id="submitBtn">
        Masuk ke Dashboard
      </button>

      <div class="demo-credentials">
        <b>Akses khusus administrator</b><br>
        Gunakan akun produksi yang diberikan pengelola sistem.
      </div>
    </form>

    <div class="login-footer-info">
      PT Poter Teknik Nusantara • Sistem Pemantau Distribusi APK<br>
      <a href="/" style="color: var(--primary); font-weight: 700; display: inline-block; margin-top: 8px;">← Kembali ke Beranda Unduh</a>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // Check if already logged in
      try {
        const res = await fetch('/api/auth/me');
        const data = await res.json();
        if (data.authenticated) {
          window.location.href = '/admin/index.html';
          return;
        }
      } catch (err) {}

      const loginForm = document.getElementById('loginForm');
      const usernameInput = document.getElementById('usernameInput');
      const passwordInput = document.getElementById('passwordInput');
      const loginError = document.getElementById('loginError');
      const submitBtn = document.getElementById('submitBtn');

      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        loginError.style.display = 'none';
        submitBtn.disabled = true;
        submitBtn.textContent = 'Memverifikasi...';

        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              username: usernameInput.value.trim(),
              password: passwordInput.value
            })
          });

          const data = await res.json();

          if (res.ok && data.success) {
            window.location.href = '/admin/index.html';
          } else {
            loginError.textContent = data.message || 'Nama pengguna atau kata sandi tidak cocok.';
            loginError.style.display = 'block';
            submitBtn.disabled = false;
            submitBtn.textContent = 'Masuk ke Dashboard';
          }
        } catch (err) {
          loginError.textContent = 'Gagal terhubung ke server. Periksa koneksi lokal Anda.';
          loginError.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Masuk ke Dashboard';
        }
      });
    });
  </script>
</body>
</html>
