<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atur Ulang Kata Sandi - POTER EDUGAMES</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="icon" type="image/png" href="/assets/poter-logo.png">
  <style>
    body {
      background-color: #F8FAFC;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .reset-card {
      background-color: #FFFFFF;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 40px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
    }
    .reset-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .reset-brand-icon {
      width: 54px;
      height: 54px;
      border-radius: 14px;
      background-color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 14px auto;
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.12);
      overflow: hidden;
    }
    .reset-brand-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 4px;
    }
    .reset-title {
      font-size: 1.45rem;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.4px;
    }
    .reset-desc {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-top: 4px;
      line-height: 1.5;
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 6px;
    }
    .form-input-wrap {
      position: relative;
    }
    .form-input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
      color: var(--text-main);
      background-color: #FFFFFF;
      outline: none;
      transition: border-color 0.15s ease;
    }
    .form-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.15);
    }
    .toggle-pass-btn {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 4px 6px;
    }
    .toggle-pass-btn:hover {
      color: var(--text-main);
    }
    .btn-submit-reset {
      width: 100%;
      background-color: var(--primary);
      color: #FFFFFF;
      font-size: 1rem;
      font-weight: 700;
      padding: 14px;
      border-radius: var(--radius-sm);
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.15s ease;
      margin-top: 8px;
      border: none;
      cursor: pointer;
    }
    .btn-submit-reset:hover {
      background-color: var(--primary-hover);
    }
    .btn-submit-reset:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }
    .reset-alert {
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 600;
      margin-bottom: 20px;
      line-height: 1.5;
    }
    .alert-danger {
      background-color: #FEE2E2;
      color: #991B1B;
      border: 1px solid #FCA5A5;
    }
    .alert-success {
      background-color: #F0FDF4;
      color: #166534;
      border: 1px solid #BBF7D0;
    }
    .alert-info {
      background-color: #EFF6FF;
      color: #1E40AF;
      border: 1px solid #BFDBFE;
      text-align: center;
    }
    .reset-footer-info {
      margin-top: 24px;
      border-top: 1px solid var(--border-color);
      padding-top: 16px;
      font-size: 0.82rem;
      color: var(--text-subtle);
      text-align: center;
    }
    .password-hint {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 5px;
    }
  </style>
</head>
<body>

  <div class="reset-card">
    <div class="reset-header">
      <div class="reset-brand-icon"><img src="/assets/poter-logo.png" width="54" height="54" alt="Logo POTER Edugames"></div>
      <h1 class="reset-title">Atur Ulang Kata Sandi</h1>
      <p class="reset-desc" id="headerDesc">Verifikasi tautan pemulihan akun administrator.</p>
    </div>

    <!-- Status Alerts -->
    <div class="reset-alert alert-info" id="loadingState">
      Memeriksa validitas tautan pemulihan...
    </div>
    <div class="reset-alert alert-danger" id="errorState" style="display: none;"></div>
    <div class="reset-alert alert-success" id="successState" style="display: none;"></div>

    <!-- Reset Password Form -->
    <form id="resetPasswordForm" style="display: none;">
      <div class="form-group">
        <label for="newPasswordInput" class="form-label">Kata Sandi Baru</label>
        <div class="form-input-wrap">
          <input 
            type="password" 
            id="newPasswordInput" 
            name="newPassword" 
            class="form-input" 
            placeholder="Minimal 8 karakter" 
            minlength="8" 
            required 
            autofocus 
          />
          <button type="button" class="toggle-pass-btn" id="toggleNewPass">Lihat</button>
        </div>
        <div class="password-hint">Gunakan kombinasi huruf, angka, atau simbol agar aman.</div>
      </div>

      <div class="form-group">
        <label for="confirmPasswordInput" class="form-label">Konfirmasi Kata Sandi Baru</label>
        <div class="form-input-wrap">
          <input 
            type="password" 
            id="confirmPasswordInput" 
            name="confirmPassword" 
            class="form-input" 
            placeholder="Ketik ulang kata sandi baru" 
            minlength="8" 
            required 
          />
          <button type="button" class="toggle-pass-btn" id="toggleConfirmPass">Lihat</button>
        </div>
      </div>

      <button type="submit" class="btn-submit-reset" id="btnSubmitReset">
        Simpan Kata Sandi Baru
      </button>
    </form>

    <div class="reset-footer-info">
      <a href="/admin/login.html" id="backToLoginLink" style="color: var(--primary); font-weight: 700; text-decoration: none;">← Kembali ke Halaman Masuk</a>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get('token');

      const loadingState = document.getElementById('loadingState');
      const errorState = document.getElementById('errorState');
      const successState = document.getElementById('successState');
      const resetForm = document.getElementById('resetPasswordForm');
      const headerDesc = document.getElementById('headerDesc');
      const newPasswordInput = document.getElementById('newPasswordInput');
      const confirmPasswordInput = document.getElementById('confirmPasswordInput');
      const btnSubmitReset = document.getElementById('btnSubmitReset');
      const toggleNewPass = document.getElementById('toggleNewPass');
      const toggleConfirmPass = document.getElementById('toggleConfirmPass');

      // Password visibility toggles
      function setupToggle(button, input) {
        button.addEventListener('click', () => {
          const isPassword = input.type === 'password';
          input.type = isPassword ? 'text' : 'password';
          button.textContent = isPassword ? 'Sembunyikan' : 'Lihat';
        });
      }
      setupToggle(toggleNewPass, newPasswordInput);
      setupToggle(toggleConfirmPass, confirmPasswordInput);

      if (!token || token.length < 32) {
        loadingState.style.display = 'none';
        errorState.innerHTML = '<strong>Tautan Tidak Valid</strong><br>Token pemulihan tidak ditemukan atau tautan rusak. Silakan ajukan tautan baru melalui halaman masuk.';
        errorState.style.display = 'block';
        return;
      }

      // Verify Token with backend
      try {
        const verifyRes = await fetch('/api/auth/verify-reset-token', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token })
        });
        const verifyData = await verifyRes.json();

        loadingState.style.display = 'none';

        if (verifyRes.ok && verifyData.valid) {
          headerDesc.textContent = 'Silakan buat kata sandi baru untuk akun administrator Anda.';
          resetForm.style.display = 'block';
          newPasswordInput.focus();
        } else {
          errorState.innerHTML = `<strong>Tautan Kedaluwarsa</strong><br>${verifyData.message || 'Tautan pemulihan sudah kedaluwarsa atau telah digunakan. Tautan reset hanya berlaku 15 menit.'}`;
          errorState.style.display = 'block';
        }
      } catch (err) {
        loadingState.style.display = 'none';
        errorState.textContent = 'Gagal memverifikasi tautan ke server. Periksa jaringan Anda.';
        errorState.style.display = 'block';
      }

      // Handle Form Submit
      resetForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorState.style.display = 'none';
        successState.style.display = 'none';

        const pass = newPasswordInput.value;
        const confirm = confirmPasswordInput.value;

        if (pass.length < 8) {
          errorState.textContent = 'Kata sandi baru minimal harus 8 karakter.';
          errorState.style.display = 'block';
          return;
        }

        if (pass !== confirm) {
          errorState.textContent = 'Konfirmasi kata sandi tidak cocok. Mohon ketik ulang dengan benar.';
          errorState.style.display = 'block';
          confirmPasswordInput.focus();
          return;
        }

        btnSubmitReset.disabled = true;
        btnSubmitReset.textContent = 'Menyimpan Kata Sandi...';

        try {
          const res = await fetch('/api/auth/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              token,
              newPassword: pass
            })
          });

          const data = await res.json();

          if (res.ok && data.success) {
            resetForm.style.display = 'none';
            headerDesc.textContent = 'Pengaturan kata sandi selesai.';
            successState.innerHTML = `<strong>Berhasil!</strong><br>${data.message}<br><br><span style="font-size: 0.85rem;">Mengalihkan ke halaman masuk dalam 3 detik...</span>`;
            successState.style.display = 'block';

            setTimeout(() => {
              window.location.href = '/admin/login.html';
            }, 3000);
          } else {
            errorState.textContent = data.message || 'Gagal mengatur ulang kata sandi.';
            errorState.style.display = 'block';
            btnSubmitReset.disabled = false;
            btnSubmitReset.textContent = 'Simpan Kata Sandi Baru';
          }
        } catch (err) {
          errorState.textContent = 'Gagal terhubung ke server saat menyimpan kata sandi.';
          errorState.style.display = 'block';
          btnSubmitReset.disabled = false;
          btnSubmitReset.textContent = 'Simpan Kata Sandi Baru';
        }
      });
    });
  </script>
</body>
</html>
